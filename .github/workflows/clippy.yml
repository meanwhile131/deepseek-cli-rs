name: Clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

